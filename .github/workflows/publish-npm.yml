name: Publish npm Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v2.5.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-npm-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_OPTIONAL: "true"
    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::Release tags must use vX.Y.Z format, for example v2.5.1."
            exit 1
          fi

          echo "release_tag=$TAG" >> "$GITHUB_ENV"
          echo "release_version=${TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm exec vp check

      - name: Test
        run: pnpm exec vp test

      - name: Build package
        run: pnpm exec vp pack

      - name: Pack and inspect release tarball
        id: pack
        shell: bash
        run: |
          PACK_DIR="$RUNNER_TEMP/npm-pack"
          mkdir -p "$PACK_DIR"
          pnpm pack --pack-destination "$PACK_DIR"

          TARBALL="$(find "$PACK_DIR" -maxdepth 1 -name '*.tgz' -print -quit)"
          if [[ -z "$TARBALL" ]]; then
            echo "::error ::pnpm pack did not produce a tarball."
            exit 1
          fi

          tar -xOf "$TARBALL" package/package.json > "$PACK_DIR/package.json"
          if grep -q "catalog:" "$PACK_DIR/package.json"; then
            echo "::error ::Packed package.json still contains catalog: specifiers."
            exit 1
          fi

          PACKED_NAME="$(node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log(pkg.name);' "$PACK_DIR/package.json")"
          PACKED_VERSION="$(node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log(pkg.version);' "$PACK_DIR/package.json")"
          if [[ "$PACKED_VERSION" != "$release_version" ]]; then
            echo "::error ::Packed version $PACKED_VERSION does not match release tag $release_tag."
            exit 1
          fi

          echo "package_name=$PACKED_NAME" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Check npmjs version
        id: npmjs
        shell: bash
        run: |
          if npm view "${{ steps.pack.outputs.package_name }}@$release_version" version --registry "https://registry.npmjs.org" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.pack.outputs.package_name }}@$release_version already exists on npmjs; skipping npmjs publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npmjs with provenance
        if: ${{ steps.npmjs.outputs.exists != 'true' }}
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Configure GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@alexasomba"

      - name: Check GitHub Packages version
        id: github_packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "${{ steps.pack.outputs.package_name }}@$release_version" version --registry "https://npm.pkg.github.com" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.pack.outputs.package_name }}@$release_version already exists on GitHub Packages; skipping GitHub Packages publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages
        if: ${{ steps.github_packages.outputs.exists != 'true' }}
        run: npm publish "${{ steps.pack.outputs.tarball }}" --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
