name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v2.4.4"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Validate release tag
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::Release tags must use vX.X.X format, for example v2.4.1."
            exit 1
          fi
          echo "release_tag=$TAG" >> $GITHUB_ENV

      - uses: pnpm/action-setup@v4
        with: {}

      - run: NPM_CONFIG_OPTIONAL=true pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test --silent

      - name: Build
        run: pnpm build

      - name: Pack release tarball
        id: pack_release
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/npm-pack"
          VERSION="${release_tag#v}"
          TARBALL="$RUNNER_TEMP/npm-pack/alexasomba-better-auth-paystack-$VERSION.tgz"
          pnpm pack --out "$TARBALL"
          tar -xOf "$TARBALL" package/package.json > "$RUNNER_TEMP/npm-pack/package.json"
          if grep -q "catalog:" "$RUNNER_TEMP/npm-pack/package.json"; then
            echo "::error ::Packed package.json still contains catalog: specifiers."
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Determine npm tag
        id: determine_npm_tag
        shell: bash
        run: |
          TAG="$release_tag"
          if [[ "$TAG" =~ -(next|canary|beta|rc) ]]; then
            NPM_TAG=${BASH_REMATCH[1]}
          else
            git fetch origin main
            RELEASE_SHA=$(git rev-parse HEAD)
            CURRENT_BRANCH=$(git branch -r --contains "$RELEASE_SHA" | grep -E 'origin/(main|v[0-9]+\.[0-9]+\.x-latest)' | head -1 | sed 's/.*origin\///')

            if [[ "$CURRENT_BRANCH" == "main" ]]; then
              NPM_TAG="latest"
            elif [[ "$CURRENT_BRANCH" =~ ^v[0-9]+\.[0-9]+\.x-latest$ ]]; then
              NPM_TAG="latest"
            else
              echo "The tagged commit is not on the main branch or a version branch (v*.*.x-latest)."
              echo "::error ::Releases with the 'latest' npm tag must be on the main branch or a version branch."
              exit 1
            fi
          fi
          echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT
          echo "Using npm tag: $NPM_TAG"

      - name: Configure npm registry (npmjs)
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npmjs
        run: npm publish "${{ steps.pack_release.outputs.tarball }}" --access public --provenance --tag ${{ steps.determine_npm_tag.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Configure npm registry (GitHub Packages)
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: "https://npm.pkg.github.com"
          scope: "@alexasomba"

      - name: Publish to GitHub Packages
        run: npm publish "${{ steps.pack_release.outputs.tarball }}" --tag ${{ steps.determine_npm_tag.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
