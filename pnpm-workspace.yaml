# Limit dependency lifecycle scripts to the native tools this workspace actually uses.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
