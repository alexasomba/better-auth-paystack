  - "@dotenvx/dotenvx@2.34.2"
  - "@dotenvx/primitives@3.3.0"
  - "@dotenvx/providers@0.3.5"
  - "@dotenvx/tooling@1.0.5"
  - "@opennextjs/aws@4.1.9"
  - "@opennextjs/cloudflare@1.20.10"
  - "@rollup/rollup-linux-x64-gnu@4.64.3"
  - "@rollup/wasm-node@4.64.3"
  - "@tanstack/react-table@9.2.8"
  - "@tanstack/table-core@9.2.8"
  - miniflare@5.20261006.1-alpha
  - seroval-plugins@1.6.9
  - seroval@1.6.9
  - wrangler@4.149.0
overrides:
