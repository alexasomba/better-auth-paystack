  undici@7: 7.29.1
  undici@8: 8.10.2
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  source-map-js: 1.2.2
  proxy-addr: 2.0.8
  esbuild: 0.28.2
  rollup: npm:@rollup/wasm-node@4.64.3
  vite@*: "catalog:"
  vitest@*: "catalog:"
  fast-uri: 3.1.8
  shell-quote: 1.11.0

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
