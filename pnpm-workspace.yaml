  "@node-minify/core>glob": 13.0.6
  next: "catalog:"
  postcss: 8.5.23
  sharp@0.34: 0.35.5
  sharp@0.35: 0.35.5
  qs: 6.16.0
  "@vitest/mocker": 5.0.3
